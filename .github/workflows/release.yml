# Release: on a tag v*, run the checks and attach the standalone files to the GitHub release:
#   kisi.html          – the viewer (open in a browser)
#   kisi-examples.html – the viewer with the example boards ThunderScope and LibreVNA, fetched
#                        from their projects at fixed commits (tools/fetch_examples.sh)
#   kisi.mjs           – the command line with the field solver (node kisi.mjs help; Node.js >= 18; smoke-tested
#                        on Node 22 and 20, the viewers headless in Chromium)
#   kisi-docs.pdf      – the documentation in docs/ as one PDF (tools/docs_pdf.py)
#   kisi-references.html – the 3D reference cases (kisi-fdtd) with kisi's models against them
#                        (validation/fdtd/make_viewer.py; built here, not kept in the repository) – attached
#                        only when the reference cases or the page builder changed since the previous release
# and publish the viewers and the documentation PDF (not the reference page) with the landing page
# (web/pages/index.html) on GitHub Pages
# (repository settings: Pages → Source "GitHub Actions"; needs a public repository on the free plan).
# Run it by hand (workflow_dispatch) to get the files as a build artifact without a release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, to see whether the reference cases changed since the previous release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: Tests
        run: cargo test --release
      - name: Build
        run: |
          cargo build --release
          cargo build --release -p kisi-wasm -p kisi-sparse --target wasm32-unknown-unknown
          W=target/wasm32-unknown-unknown/release
          python3 tools/bundle.py web/index.html $W/kisi_wasm.wasm $W/kisi_sparse.wasm dist/kisi.html
          sh tools/fetch_examples.sh examples
          python3 tools/bundle.py web/index.html $W/kisi_wasm.wasm $W/kisi_sparse.wasm dist/kisi-examples.html \
            ts "ThunderScope Rev5.3" examples/Thunderscope_Rev5.3.kicad_pcb examples/Thunderscope_Rev5.3.kicad_pro \
            vna LibreVNA examples/VNA.kicad_pcb examples/VNA.kicad_pro
          python3 tools/bundle_cli.py $W/kisi_wasm.wasm $W/kisi_sparse.wasm dist/kisi.mjs
      - name: Reference cases page
        run: |
          python3 -c "import numpy" 2>/dev/null || sudo apt-get install -y python3-numpy
          python3 validation/fdtd/make_viewer.py validation/via_ref dist/kisi-references.html
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Documentation PDF
        run: |
          python3 -m pip install --quiet playwright markdown==3.10.3 pypdf==5.9.0
          python3 -m playwright install --with-deps chromium
          python3 tools/docs_pdf.py dist/kisi-docs.pdf
      - name: Field solver validation (HFSS / baseline, viewer bundle)
        run: sh tools/validate_field.sh
      - name: Smoke test of kisi.mjs
        run: |
          node dist/kisi.mjs --version
          node dist/kisi.mjs profiles > /dev/null
          node dist/kisi.mjs help > /dev/null
          for b in ts:Thunderscope_Rev5.3 vna:VNA; do
            node dist/kisi.mjs config-check examples/${b#*:}.kicad_pcb --config web/samples/${b%%:*}.kisi.json | grep -q '"ok": true'
            node dist/kisi.mjs power examples/${b#*:}.kicad_pcb --config web/samples/${b%%:*}.kisi.json > /dev/null
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Smoke test of kisi.mjs on Node 20
        run: |
          node --version
          node dist/kisi.mjs --version
          node dist/kisi.mjs config-check examples/VNA.kicad_pcb --config web/samples/vna.kisi.json | grep -q '"ok": true'
          node dist/kisi.mjs check examples/VNA.kicad_pcb --config web/samples/vna.kisi.json --formula > /dev/null
      - name: Smoke test of the viewers (headless Chromium)
        run: |
          python3 -m pip install --quiet playwright numpy
          python3 -m playwright install --with-deps chromium
          python3 tools/check_viewer.py dist/kisi-examples.html --quick --layouts light
          python3 tools/check_viewer.py dist/kisi.html --quick --layouts light \
            --board examples/VNA.kicad_pcb examples/VNA.kicad_pro --config web/samples/vna.kisi.json
      - uses: actions/upload-artifact@v6
        with:
          name: kisi
          path: |
            dist/kisi.html
            dist/kisi-examples.html
            dist/kisi.mjs
            dist/kisi-docs.pdf
            dist/kisi-references.html
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "kisi $GITHUB_REF_NAME" --generate-notes
          files="dist/kisi.html dist/kisi-examples.html dist/kisi.mjs dist/kisi-docs.pdf"
          # the reference page only when its cases or builder changed since the previous release tag
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$prev" ] || ! git diff --quiet "$prev" "$GITHUB_REF_NAME" -- validation/via_ref validation/fdtd/make_viewer.py validation/fdtd/viewer_template.html; then
            files="$files dist/kisi-references.html"
          else
            echo "::notice::reference cases unchanged since $prev: kisi-references.html not attached (it stays on $prev's release)"
          fi
          gh release upload "$GITHUB_REF_NAME" $files --clobber

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: kisi
          path: site
      - name: Site
        run: |
          cp web/pages/index.html site/
          rm -f site/kisi-references.html   # the reference page stays a release file
          mkdir -p site/fonts site/img
          cp web/fonts/fonts.css web/fonts/*.woff2 web/fonts/OFL-*.txt site/fonts/
          cp docs/img/*.png site/img/
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
