[workspace]
resolver = "2"
members = [
    "crates/kisi-board",
    "crates/kisi-si",
    "crates/kisi-pi",
    "crates/kisi-core",
    "crates/kisi-cli",
    "crates/kisi-wasm",
    "crates/kisi-sparse",
    "crates/kisi-fdtd",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "GPL-3.0-only"
authors = ["David Riehl", "kisi contributors"]
repository = "https://github.com/riehlies/kisi"

# Lints for all crates (each crate has `[lints] workspace = true`). Allowed: deliberate styles of the numeric code.
[workspace.lints.clippy]
# numeric kernels index several parallel arrays (and neighbours i±1) with one loop variable
needless_range_loop = "allow"
# solver and model functions take the physical parameters one by one, as in the formulas they implement
too_many_arguments = "allow"
# tuples of geometry and result values are returned and stored without a named type
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# kisi-core is the facade (project, JSON summaries, commands, configuration, the printable report): little
# numeric work of its own, but much generic JSON code. Optimised for size it takes a third less room in the
# WebAssembly bundles (kisi_wasm.wasm 6.21 -> 5.94 MB) at the same speed (kisi report on ThunderScope 12.5 s
# either way) and with identical results; the solvers in kisi-si, kisi-pi and kisi-sparse stay at opt-level 3.
[profile.release.package.kisi-core]
opt-level = "s"
