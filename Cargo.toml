[workspace]
resolver = "2"
members = [
    "crates/kisi-board",
    "crates/kisi-si",
    "crates/kisi-pi",
    "crates/kisi-core",
    "crates/kisi-cli",
    "crates/kisi-wasm",
    "crates/kisi-sparse",
    "crates/kisi-fdtd",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-only"
authors = ["David Riehl", "kisi contributors"]
repository = "https://github.com/riehlies/kisi"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
