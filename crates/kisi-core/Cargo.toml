[package]
name = "kisi-core"
description = "Facade over kisi-board, kisi-si and kisi-pi (stable paths for the CLI and WASM front ends)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
kisi-board = { path = "../kisi-board" }
kisi-si = { path = "../kisi-si" }
kisi-pi = { path = "../kisi-pi" }
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: numbers read back exactly (check rows from worker engines, field results from JS)
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
