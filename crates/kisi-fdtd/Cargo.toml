[package]
name = "kisi-fdtd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "3D FDTD (Yee) for via transitions and small PCB cut-outs: non-uniform mesh, lumped ports, S-parameters"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kisi-fdtd"
path = "src/main.rs"

[features]
# Prototype via field viewer (tools/proto_via_field.py, wasm only): `fd_mesh` and progress reports through the
# imported `env.fd_progress(step, energy_db)` during `fd_run_volume`. Off by default: the default WebAssembly module
# has no imports.
proto-viewer = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
