<title>kisi 3D References</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
/* Layout: kisi viewer look (sage neutrals, copper accent); header with two views, case list beside the case sheet */
:root {
  --bg: #e9ede9; --panel: #f7f9f7; --panel-2: #eef2ef; --fg: #17201b; --muted: #59665f; --line: #d2d9d4;
  --accent: #a9561f; --accent-soft: #f1e2d6; --diel: #c9d6c2; --cu: #b0672b; --gnd: #6d7a72;
  --s1: #a9561f; --s2: #2f6fb0; --s3: #7a52c4; --s4: #23905a; --ok: #23a05a; --warn: #c98612; --bad: #d63c3c;
  --k-ms: #d07b2f; --k-sl: #2f86c8; --k-emb: #8a5bd6;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --panel: #151b18; --panel-2: #1b2320; --fg: #e2e9e4; --muted: #8e9b94; --line: #27312c;
  --accent: #e08f52; --accent-soft: #3a2a1e; --diel: #2c3a30; --cu: #d98a4a; --gnd: #8fa097;
  --s1: #e08f52; --s2: #5fa6e8; --s3: #a682ef; --s4: #3cc477; --ok: #3cc477; --warn: #f0ae35; --bad: #f25d5d;
  --k-ms: #ec9a4f; --k-sl: #52a6e6; --k-emb: #a682ef; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1412; --panel: #151b18; --panel-2: #1b2320; --fg: #e2e9e4; --muted: #8e9b94; --line: #27312c;
  --accent: #e08f52; --accent-soft: #3a2a1e; --diel: #2c3a30; --cu: #d98a4a; --gnd: #8fa097;
  --s1: #e08f52; --s2: #5fa6e8; --s3: #a682ef; --s4: #3cc477; --ok: #3cc477; --warn: #f0ae35; --bad: #f25d5d;
  --k-ms: #ec9a4f; --k-sl: #52a6e6; --k-emb: #a682ef; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0 }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.brand { display: flex; align-items: baseline; gap: 8px }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--accent); letter-spacing: .02em }
.brand span { font-family: var(--font-display); font-weight: 600; font-size: 18px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font: 600 14px var(--font-display); color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg) }
.seg button:focus-visible, .case-list button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.sub { color: var(--muted); font-size: 13px; flex: 1 1 260px; min-width: 0 }
main { padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.cases { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start }
nav.case-list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 90px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 0 }
.case-list h3 { font: 700 13px var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 12px 4px }
.case-list p.gd { margin: 0 12px 4px; font-size: 12px; color: var(--muted) }
.case-list button { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; padding: 4px 12px; cursor: pointer; color: var(--fg); font: 13px var(--font-body) }
.case-list button:hover { background: var(--panel-2) }
.case-list button[aria-current="true"] { background: var(--accent-soft) }
.case-list button .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line); transform: translateY(-1px) }
.case-list button .dot.done { background: var(--ok) }
#case-select { display: none; width: 100%; padding: 8px; font: 14px var(--font-body); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius) }
h1 { font: 700 26px/1.15 var(--font-display); margin: 0 0 6px; text-wrap: balance }
h2 { font: 600 17px var(--font-display); margin: 0 0 8px; letter-spacing: .01em }
.id { font-family: var(--font-mono); font-size: 12px; color: var(--muted) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums }
.chip b { font-weight: 600 }
.chip.ok { border-color: var(--ok) } .chip.warn { border-color: var(--warn) }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0 }
.panel .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.readout { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em }
svg { display: block; width: 100%; height: auto; max-width: 100% }
svg text { fill: var(--muted); font: 11px var(--font-body) }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px }
.legend i.dash { border-top-style: dashed }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 10px }
.note { color: var(--muted); font-size: 12.5px; max-width: 70ch }
.wide { overflow-x: auto }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: 100% }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap }
th:first-child, td:first-child { text-align: left }
th { font: 600 12px var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.checks { display: grid; gap: 16px; max-width: 1100px }
.checks p { max-width: 75ch; margin: 0 0 10px }
.pending { color: var(--muted); font-style: italic }
.field { margin-top: 14px }
.field > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.field > summary::-webkit-details-marker { display: none }
.field > summary h2 { margin: 0 }
.field > summary::before { content: "▸"; color: var(--muted); font-size: 13px; transition: transform .15s }
.field[open] > summary::before { transform: rotate(90deg) }
.field > summary .note { margin: 0 }
.field > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.field[open] > summary { margin-bottom: 4px }
.field .ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 4px 0 8px }
.field canvas { display: block; width: 100%; height: auto; border-radius: 4px; background: var(--panel-2) }
.field .scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px }
.field .scale canvas { width: 160px; height: 10px; border-radius: 2px }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; font: 600 13px var(--font-display) }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
@media (max-width: 760px) {
  .cases { grid-template-columns: minmax(0, 1fr) }
  nav.case-list { display: none }
  #case-select { display: block; margin-bottom: 12px }
  .grid { grid-template-columns: minmax(0, 1fr) }
}
</style>

<header>
  <div class="brand"><b>kisi</b><span>3D references</span></div>
  <div class="seg" role="group" aria-label="View">
    <button id="tab-cases" aria-pressed="true">Reference cases</button>
    <button id="tab-checks" aria-pressed="false">Solver checks</button>
  </div>
  <div class="sub" id="summary"></div>
</header>
<main>
  <section id="view-cases" class="cases">
    <nav class="case-list" id="case-list" aria-label="Cases"></nav>
    <div style="min-width:0">
      <select id="case-select" aria-label="Case"></select>
      <div id="case"></div>
    </div>
  </section>
  <section id="view-checks" class="checks" hidden></section>
</main>

<script>
"use strict";
const DATA = __DATA__;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const GROUPS = {
  A: ["Coax section", "Via through a plane pair with a clean return path: impedance and delay of the coaxial section."],
  B: ["Stubs", "Through vias with an open stub, without a stub and back-drilled: stub resonance and its depth."],
  C: ["Antipads and pads", "Antipad size per plane, non-functional pads, an offset antipad."],
  D: ["Return path", "One GND stitching via at a distance, or none: the return current crosses the plane pairs."],
  E: ["Differential pairs", "Via pairs: pitch, round or oval antipads, GND vias. Mixed mode with kisi's port order."],
  G: ["Plane cavity", "Rectangular plane pair: impedance and resonances seen from a corner and the centre (1 Ω ports)."],
  H: ["PDN loop inductance", "BGA pin field to one capacitor at a distance: loop inductance from Im(Z)/ω (1 Ω port)."],
  T: ["Lines and coupling", "Transmission lines (microstrip, stripline, CPWG; 10 and 20 mm for Zc and εeff), coupled pairs, single-ended aggressor and victim, broadside: kisi's line and crosstalk models against 3D."],
  X: ["Inner exit, one plane removed", "L1→L3 as in B, without the L2 or the L4 plane: separates the junction of trace and via from the shared-cavity effect (calibration of the junction model)."],
  thru: ["2×thru", "Feed lines alone (twice the feed length): the fixtures for de-embedding."],
};
const TOOLS = { kisi: ["kisi-fdtd", "var(--s1)", ""], kisi_fine: ["kisi-fdtd, finer mesh", "var(--s1)", "dash"], openems: ["openEMS (staircase)", "var(--s2)", ""],
  kisi_model: ["kisi channel model (fast)", "var(--s3)", "dash"], deembedded: ["kisi-fdtd, de-embedded", "var(--s4)", ""], pbm: ["via ladder, Python prototype", "var(--s2)", "dash"], ladder: ["via ladder in kisi (Rust)", "var(--s3)", ""],
  model: ["cavity model", "var(--s2)", "dash"] };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v.replace(/^var\((.*)\)$/, "$1")).trim();
const cases = DATA.cases;
const byId = new Map(cases.map((c) => [c.id, c]));
let cur = null, mode = "raw";

// ------------------------------------------------------------------ chart
function chart({ x, series, xlabel, ylabel, ymin, ymax, logx, logy, w = 560, h, vlines = [] }) {
  const W = w, H = h || Math.round(Math.min(300, Math.max(210, w * 0.58))), L = 46, R = 10, T = 10, B = 34;
  const xs = logx ? x.map(Math.log10) : x;
  const all = series.flatMap((s) => s.y.filter((v) => v != null && isFinite(v)));
  let y0 = ymin ?? Math.min(...all), y1 = ymax ?? Math.max(...all);
  if (logy) { y0 = Math.log10(y0); y1 = Math.log10(y1); }
  if (y1 - y0 < 1e-9) { y1 += 1; y0 -= 1; }
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const nice = (lo, hi, n) => { const st = Math.pow(10, Math.floor(Math.log10((hi - lo) / n))); const m = [1, 2, 2.5, 5, 10].find((k) => (hi - lo) / (k * st) <= n) * st; const out = []; for (let v = Math.ceil(lo / m - 1e-9) * m; v <= hi + 1e-9; v += m) out.push(+v.toFixed(10)); return out; };
  // log axes: 1-2-5 ticks per decade (in log10 units)
  const logt = (lo, hi) => { const out = []; for (let d = Math.floor(lo); d <= Math.ceil(hi); d++) for (const m of [1, 2, 5]) { const v = d + Math.log10(m); if (v >= lo - 1e-9 && v <= hi + 1e-9) out.push(v); } return out.length > 7 ? out.filter((v) => Math.abs(v - Math.round(v)) < 1e-9) : out; };
  const fmtl = (v) => { const x = Math.pow(10, v); return x >= 1000 ? (x / 1000) + "k" : +x.toPrecision(2); };
  const yt = logy ? logt(y0, y1) : nice(y0, y1, 5);
  if (!ymin && !logy) y0 = Math.min(y0, yt[0]);
  if (!ymax && !logy) y1 = Math.max(y1, yt[yt.length - 1]);
  const px = (v) => L + (v - x0) / (x1 - x0) * (W - L - R);
  const py = (v) => T + (1 - ((logy ? Math.log10(v) : v) - y0) / (y1 - y0)) * (H - T - B);
  const xt = logx ? logt(x0, x1) : nice(x0, x1, 6);
  let g = "";
  for (const v of yt) { const yy = T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${logy ? fmtl(v) : v}</text>`; }
  for (const v of xt) { const xx = px(v); g += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width="1" opacity=".6"/><text x="${xx}" y="${H - B + 15}" text-anchor="middle">${logx ? fmtl(v) : v}</text>`; }
  g += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${esc(xlabel)}</text><text transform="translate(11 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(ylabel)}</text>`;
  let p = "";
  for (const v of vlines) { const xv = logx ? Math.log10(v.x) : v.x; if (xv < x0 || xv > x1) continue; p += `<line x1="${px(xv)}" x2="${px(xv)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3" stroke-width="1"/><text x="${px(xv) + 3}" y="${T + 11}">${esc(v.label)}</text>`; }
  for (const s of series) {
    let d = "", pen = false;
    s.y.forEach((v, i) => {
      if (v == null || !isFinite(v) || (logy && v <= 0)) { pen = false; return; }
      const yy = Math.max(T - 2, Math.min(H - B + 2, py(v)));
      d += `${pen ? "L" : "M"}${px(xs[i]).toFixed(1)} ${yy.toFixed(1)}`; pen = true;
    });
    if (s.marks) p += s.y.map((v, i) => v == null ? "" : `<circle cx="${px(xs[i]).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.2" fill="${s.color}"/>`).join("");
    p += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.6}" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
  }
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const svg = `<svg viewBox="0 0 ${W} ${H}" id="${id}" role="img" aria-label="${esc(ylabel)} over ${esc(xlabel)}"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="none"/>${g}<g>${p}</g><line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/></svg>`;
  const hook = (box, out) => {
    const el = box.querySelector("#" + id);
    el.addEventListener("pointermove", (ev) => {
      const r = el.getBoundingClientRect(); const vx = (ev.clientX - r.left) / r.width * W;
      if (vx < L || vx > W - R) return;
      const xv = x0 + (vx - L) / (W - L - R) * (x1 - x0);
      let k = 0; for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - xv) < Math.abs(xs[k] - xv)) k = i;
      const ln = el.querySelector(".cross"); ln.setAttribute("x1", px(xs[k])); ln.setAttribute("x2", px(xs[k])); ln.setAttribute("visibility", "visible");
      out.textContent = `${x[k]} ${xlabel.split(" ").pop()}: ` + series.map((s) => `${s.name} ${s.y[k] == null ? "–" : s.y[k]}`).join(" · ");
    });
    el.addEventListener("pointerleave", () => { el.querySelector(".cross").setAttribute("visibility", "hidden"); out.textContent = ""; });
  };
  return { svg, hook };
}
function panel(title, ch, legend, note) {
  const box = document.createElement("div");
  box.className = "panel";
  box.innerHTML = `<div class="hd"><h2>${esc(title)}</h2></div><div class="readout"></div>${ch.svg}` + (legend ? `<div class="legend">${legend}</div>` : "") + (note ? `<p class="note">${note}</p>` : "");
  ch.hook(box, box.querySelector(".readout"));
  return box;
}
const lg = (items) => items.map(([n, c, d]) => `<span><i class="${d}" style="border-color:${c}"></i>${esc(n)}</span>`).join("");

// ------------------------------------------------------------------ geometry
function layerColor(c, z) {
  const zc = c.meta.copper_z, i = zc.findIndex((v) => Math.abs(v - z) < 1e-6);
  return i === 0 || i === zc.length - 1 ? "var(--k-ms)" : "var(--k-sl)";
}
function topView(c, ext, title, W = 560) {
  const cs = c.case;
  const [x0, y0, x1, y1] = ext;
  W = Math.round(W);
  const s = W / (x1 - x0), H = Math.max(120, Math.round((y1 - y0) * s));
  const sx = (x) => ((x - x0) * s).toFixed(2), sy = (y) => ((y1 - y) * s).toFixed(2), sr = (r) => (r * s).toFixed(2);
  let g = `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--diel)" opacity=".55"/>`;
  // plane metal with the union of all antipads (outlines per plane)
  const isPlane = (sh) => (sh.net === "GND" || sh.net === "PWR") && Math.abs(sh.rect[0] - cs.board[0]) < 1e-6 && Math.abs(sh.rect[2] - cs.board[2]) < 1e-6;
  const planes = cs.sheets.filter(isPlane);
  if (planes.length) {
    g += `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--gnd)" opacity=".28"/>`;
    const seen = new Set();
    planes.forEach((pl) => pl.holes.forEach((h) => {
      const key = h.join(","); const dup = seen.has(key); seen.add(key);
      if (h.length < 5) g += `<circle cx="${sx(h[0])}" cy="${sy(h[1])}" r="${sr(h[2])}" fill="var(--diel)" stroke="var(--gnd)" stroke-width="1" ${dup ? 'fill-opacity="0"' : ""} stroke-dasharray="3 2"/>`;
      else { const [ax, ay, bx, by, r] = h; g += `<line x1="${sx(ax)}" y1="${sy(ay)}" x2="${sx(bx)}" y2="${sy(by)}" stroke="var(--diel)" stroke-width="${2 * r * s}" stroke-linecap="round"/><line x1="${sx(ax)}" y1="${sy(ay)}" x2="${sx(bx)}" y2="${sy(by)}" stroke="var(--gnd)" stroke-width="1" stroke-dasharray="3 2"/>`; }
    }));
  }
  // traces, bottom layers first
  const tr = cs.sheets.filter((sh) => !isPlane(sh)).sort((a, b) => a.z - b.z);
  for (const t of tr) { const r = t.rect; const sig = t.net === "SIG"; g += `<rect x="${sx(r[0])}" y="${sy(r[3])}" width="${((r[2] - r[0]) * s).toFixed(2)}" height="${((r[3] - r[1]) * s).toFixed(2)}" fill="${sig ? layerColor(c, t.z) : "var(--cu)"}" opacity="${sig ? 0.85 : 0.45}"/>`; }
  for (const v of cs.vias) {
    if (v.pads && v.pads.length) g += `<circle cx="${sx(v.x)}" cy="${sy(v.y)}" r="${sr(v.pad_r)}" fill="var(--cu)" opacity=".55"/>`;
    g += `<circle cx="${sx(v.x)}" cy="${sy(v.y)}" r="${sr(v.r)}" fill="${v.net === "GND" ? "var(--gnd)" : "var(--cu)"}" stroke="var(--panel)" stroke-width=".8"/>`;
  }
  cs.ports.forEach((p, i) => {
    if (p.x < x0 || p.x > x1) return;
    const yc = (p.y0 + p.y1) / 2;
    g += `<g><circle cx="${sx(p.x)}" cy="${sy(yc)}" r="7" fill="var(--panel)" stroke="var(--fg)" stroke-width="1"/><text x="${sx(p.x)}" y="${+sy(yc) + 3.5}" text-anchor="middle" style="fill:var(--fg);font-weight:600;font-size:10px">${i + 1}</text></g>`;
  });
  // scale bar 1 mm
  const sb = Math.pow(10, Math.floor(Math.log10((x1 - x0) / 4)));
  g += `<line x1="10" x2="${10 + sb * s}" y1="${H - 10}" y2="${H - 10}" stroke="var(--fg)" stroke-width="2"/><text x="${10 + sb * s + 5}" y="${H - 6}">${sb} mm</text>`;
  return `<div class="panel"><h2>${esc(title)}</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}
function section(c, W = 560) {
  const cs = c.case, zc = c.meta.copper_z;
  const yc = cs.ports.length ? (cs.ports[0].y0 + cs.ports[0].y1) / 2 : 0;
  const [x0, , z0, x1, , z1] = cs.domain;
  const zt = zc[0], zb = zc[zc.length - 1];
  const zlo = zb - 0.35, zhi = zt + 0.35;
  W = Math.round(W);

  }
  if (c.tl) {
    grid.appendChild(panel("Line impedance Zc", chart({ x: f, series: [{ name: "Zc (ABCD of the 20 mm line)", y: c.tl.zc, color: "var(--s1)" }], xlabel: "frequency GHz", ylabel: "Ω", w: pw }),
      lg([["Zc", "var(--s1)", ""]]), "From the ABCD matrix of the 20 mm line between 50 Ω lumped ports (the port parasitics show as ripple at high frequency)."));
    grid.appendChild(panel("Effective permittivity εeff", chart({ x: f, series: [{ name: "εeff", y: c.tl.eeff, color: "var(--s2)" }], xlabel: "frequency GHz", ylabel: "εeff", w: pw }),
      lg([["εeff, " + c.tl.source, "var(--s2)", ""]]), "Propagation constant from " + esc(c.tl.source) + "; loss (dB/mm) in the readout of the next chart."));
    grid.appendChild(panel("Attenuation", chart({ x: f, series: [{ name: "α", y: c.tl.loss_db_per_mm, color: "var(--s3)" }], xlabel: "frequency GHz", ylabel: "dB/mm", w: pw }),
      lg([["α (dielectric loss as σ fixed at f_loss: constant over frequency)", "var(--s3)", ""]])));
  }
  const td = c.tdr;
  const tdSer = [{ name: two ? "Z" : "Z single-ended", y: td.z, color: "var(--s1)" }];
  if (td.zdd) tdSer.push({ name: "Zdiff", y: td.zdd, color: "var(--s3)" });
  grid.appendChild(panel("TDR at port 1 (25 ps edge)", chart({ x: td.t, series: tdSer, xlabel: "time ps", ylabel: "Ω", w: pw }), lg(tdSer.map((s) => [s.name, s.color, ""])), "From the raw S11 (feed line, via, feed line): the via sits in the middle of the trace. Edge 10–90 %, Gaussian."));
  box.appendChild(grid);
}

// ------------------------------------------------------------------ list, routing
function buildList() {
  const nav = $("case-list"), sel = $("case-select");
  let html = "", opts = "";
  for (const [g, [name, txt]] of Object.entries(GROUPS)) {
    const cs = cases.filter((c) => c.meta.group === g); if (!cs.length) continue;
    html += `<h3>${g === "thru" ? "" : g + " · "}${esc(name)}</h3><p class="gd">${esc(txt)}</p>`;
    opts += `<optgroup label="${esc((g === "thru" ? "" : g + " · ") + name)}">`;
    for (const c of cs) {
      const t = c.meta.title.replace(/^(L\d.*?|pair )/, "$1");
      html += `<button data-id="${c.id}"><span class="dot ${c.res ? "done" : ""}"></span><span>${esc(t)}</span></button>`;
      opts += `<option value="${c.id}">${esc(t)}</option>`;
    }
    opts += "</optgroup>";
  }
  nav.innerHTML = html; sel.innerHTML = opts;
  nav.querySelectorAll("button[data-id]").forEach((b) => b.onclick = () => go(b.dataset.id));
  sel.onchange = () => go(sel.value);
}
function go(id) {
  if (id === "checks") { show("checks"); renderChecks(); try { history.replaceState(null, "", "#checks"); } catch (e) {} return; }
  const c = byId.get(id) || cases.find((x) => x.res) || cases[0];
  show("cases");
  renderCase(c);
  $("case-list").querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", b.dataset.id === c.id));
  $("case-select").value = c.id;
  try { history.replaceState(null, "", "#" + c.id); } catch (e) {}
}
function show(v) {
  $("view-cases").hidden = v !== "cases"; $("view-checks").hidden = v !== "checks";
  $("tab-cases").setAttribute("aria-pressed", v === "cases"); $("tab-checks").setAttribute("aria-pressed", v === "checks");
}
$("tab-cases").onclick = () => go(cur ? cur.id : "");
$("tab-checks").onclick = () => go("checks");

// ------------------------------------------------------------------ solver checks
let checksDone = false;
function renderChecks() {
  const box = $("view-checks");
  if (checksDone) return;
  checksDone = true;
  const cw = Math.min(1100, box.clientWidth || 900) - 26;
  const ch = DATA.checks;
  let n = 0;
  for (const key of ["cavity", "via_convergence", "pml_thru", "openems_compare", "via_pbm", "rust_models", "cavity_model", "kisi_models", "kisi_models_field", "pdn_loop", "practice"]) {
    const c = ch[key]; if (!c) continue; n++;
    const p = document.createElement("div"); p.className = "panel";
    p.innerHTML = `<h2>${esc(c.title)}</h2>${(c.text || []).map((t) => `<p>${t}</p>`).join("")}` + (c.cols ? `<div class="wide"><table><thead><tr>${c.cols.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "");
    box.appendChild(p);
    for (const cc of c.charts || []) {
      const series = cc.series.map((s, i) => ({ ...s, color: s.color || ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"][i % 4] }));
      box.appendChild(panel(cc.title, chart({ ...cc, series, w: cw, h: Math.round(Math.min(320, Math.max(220, cw * 0.4))) }), lg(series.map((s) => [s.name, s.color, s.dash ? "dash" : ""])), cc.note));
    }
  }
  if (!n) box.innerHTML = `<p class="pending">No solver checks in this build.</p>`;
}

const done = cases.filter((c) => c.res).length;
$("summary").textContent = `${cases.length} cases, ${done} computed with kisi-fdtd (3D FDTD, conformal metal, CPML). Zero-thickness copper, planes continue into the PML.`;
buildList();
go((location.hash || "").slice(1));
window.addEventListener("hashchange", () => { const h = (location.hash || "").slice(1); if (h !== (cur && cur.id) && !(h === "checks" && !$("view-checks").hidden)) go(h); });
</script>
